<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-labelledby="title desc">
  <title id="title">Incident and backscattered directions in body coordinates</title>
  <desc id="desc">The body axis is positive z upward. The incident wave vector d makes angle beta with z and points upper right. Monostatic observation q equals minus d and points lower left.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="620" height="300" rx="8" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="16" fill="#172033">
    <path d="M260 150 L260 20 M260 150 L450 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="272" y="30">+z (body axis)</text><text x="455" y="156">+x</text>
    <circle cx="260" cy="150" r="20" fill="#e2e8f0" stroke="#64748b"/>
    <path d="M260 150 L365 45" stroke="#174e8a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="380" y="57">incident wave vector d</text>
    <path d="M260 150 L155 255" stroke="#a44200" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
    <text x="20" y="280">backscatter observation q = -d</text>
    <path d="M260 102 A48 48 0 0 1 294 116" fill="none" stroke="#174e8a" stroke-width="2"/>
    <text x="275" y="98">beta</text>
    <text x="345" y="207">Axial: beta = 0</text>
    <text x="345" y="232">Broadside: beta = pi/2</text>
  </g>
</svg>
