name: Extended tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JULIA_PKG_PRECOMPILE_AUTO: '0'
  JULIA_CPU_TARGET: generic
  JULIA_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  select_extended:
    name: Select extended tasks
    runs-on: ubuntu-latest
    outputs:
      selections: ${{ steps.select.outputs.selections }}
      has_tests: ${{ steps.select.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Select extended tasks
        id: select
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$DISPATCH" = "true" ]; then
            julia --startup-file=no .github/scripts/select_extended.jl All
          else
            julia --startup-file=no .github/scripts/select_extended.jl "$BASE_SHA" "$HEAD_SHA"
          fi

  extended:
    name: Extended (${{ matrix.selection.task }}, ${{ matrix.os }})
    needs: select_extended
    if: needs.select_extended.result == 'success' && needs.select_extended.outputs.has_tests == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        selection: ${{ fromJSON(needs.select_extended.outputs.selections) }}
    env:
      JULIA_PROJECT: test
      TEST_PROJECT: test
      TEST_SUITE: Extended
      TEST_EXTENDED_FILES: ${{ matrix.selection.file }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: tests-${{ matrix.os }}-1-plots
          include-matrix: false
          delete-old-caches: false
      - name: Install extended test dependencies
        shell: julia --startup-file=no --check-bounds=yes --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(ENV["TEST_PROJECT"])
          Pkg.develop(PackageSpec(; path = pwd()))
          Pkg.instantiate()
          using Preferences: set_preferences!
          set_preferences!(Base.UUID("37bc0722-8b3f-41d8-b4ae-17decd3486a9"),
              "precompile_workload" => false; force = true)
      - name: Run extended tests
        run: julia --startup-file=no --check-bounds=yes --color=yes test/runtests.jl
