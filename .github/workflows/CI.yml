name: Build status
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
    tags: ["*"]
  pull_request:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  JULIA_PKG_PRECOMPILE_AUTO: '0'
  JULIA_CPU_TARGET: generic
  JULIA_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Check SciML formatting
        shell: julia --startup-file=no --color=yes {0}
        run: |
          import Pkg
          Pkg.activate(; temp = true)
          Pkg.add(Pkg.PackageSpec(; name = "JuliaFormatter", version = "2.14.0"))
          using JuliaFormatter: format
          format(["src", "ext", "test", "docs"]; overwrite = false) ||
              error("Formatting required. See the developer guide for the formatting command.")
  test-install-dependencies:
    name: Test install & dependencies (Julia ${{ matrix.version }}, ${{ matrix.os }}, ${{ matrix.flavor }})
    runs-on: ${{ matrix.os }}
    env:
      TEST_PROJECT: ${{ matrix.flavor == 'plots' && 'test' || 'test/core' }}
      JULIA_PROJECT: ${{ matrix.flavor == 'plots' && 'test' || 'test/core' }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [core, plots]
        version:
          - '1.10'
          - '1'
          - 'pre'
          - 'nightly'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: tests-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.flavor }}
          include-matrix: false
          delete-old-caches: false
      - name: Install dependencies
        shell: julia --startup-file=no --check-bounds=yes --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(ENV["TEST_PROJECT"])
          Pkg.develop(PackageSpec(; path = pwd()))
          Pkg.instantiate()
          using Preferences: set_preferences!
          set_preferences!(Base.UUID("37bc0722-8b3f-41d8-b4ae-17decd3486a9"),
              "precompile_workload" => false; force = true)
      - name: Test dependency precompilation
        shell: julia --startup-file=no --check-bounds=yes --color=yes {0}
        run: |
          using Pkg
          Pkg.precompile(; strict = true)
      - name: Store resolved test environment
        uses: actions/upload-artifact@v7
        with:
          name: test-environment-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.flavor }}
          path: |
            ${{ env.TEST_PROJECT }}/Manifest.toml
            ${{ env.TEST_PROJECT }}/LocalPreferences.toml
          if-no-files-found: error
          retention-days: 7
      - name: Run basic tests
        # basic_coverage owns this one Basic run on push/PR; dispatch keeps it here.
        if: >-
          matrix.flavor == 'plots' &&
          (github.event_name == 'workflow_dispatch' ||
           matrix.os != 'ubuntu-latest' ||
           matrix.version != '1.10')
        env:
          TEST_SUITE: Basic
        run: julia --startup-file=no --check-bounds=yes --color=yes test/runtests.jl
  basic_coverage:
    name: Basic coverage (Julia 1.10, ubuntu-latest)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      JULIA_PROJECT: test
      TEST_PROJECT: test
      TEST_SUITE: Basic
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
        with:
          cache-name: tests-ubuntu-latest-1.10-plots
          include-matrix: false
          delete-old-caches: false
      - name: Install test dependencies
        shell: julia --startup-file=no --check-bounds=yes --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(ENV["TEST_PROJECT"])
          Pkg.develop(PackageSpec(; path = pwd()))
          Pkg.instantiate()
          using Preferences: set_preferences!
          set_preferences!(Base.UUID("37bc0722-8b3f-41d8-b4ae-17decd3486a9"),
              "precompile_workload" => false; force = true)
      - name: Run basic tests with source coverage
        id: tests
        run: julia --startup-file=no --check-bounds=yes --color=yes --code-coverage=@src test/runtests.jl
      - name: Process coverage results
        id: process
        if: always() && steps.tests.outcome != 'skipped'
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage report
        if: always() && steps.process.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: basic-coverage-ubuntu-1.10
          path: lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: Upload Basic coverage to Codecov
        if: always() && steps.process.outcome == 'success'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
