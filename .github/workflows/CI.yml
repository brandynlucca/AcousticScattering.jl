name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Install pinned formatter
        run: julia --project=dev -e 'using Pkg; Pkg.instantiate()'
      - name: Check SciML formatting
        run: julia --project=dev dev/format.jl --check
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.10 is both the minimum supported series and current LTS (2026-09-09).
        version: ["1.10", "1"]
        os: [ubuntu-latest]
        arch: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  install:
    name: Install (Julia ${{ matrix.version }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
        mode: [standard, opt-out]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      # No cache: the harness gives each case its own empty depot and source snapshot.
      - name: Verify isolated installation and precompile preferences
        run: julia --startup-file=no dev/check_install.jl --mode=${{ matrix.mode }}
