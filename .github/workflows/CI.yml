name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Check SciML formatting
        shell: julia --startup-file=no --color=yes {0}
        run: |
          import Pkg
          Pkg.activate(; temp = true)
          Pkg.add(Pkg.PackageSpec(; name = "JuliaFormatter", version = "2.14.0"))
          using JuliaFormatter: format
          format(["src", "ext", "test", "docs"]; overwrite = false) ||
              error("Formatting required. See the developer guide for the formatting command.")
  test-dependencies:
    name: Test dependencies (Julia ${{ matrix.version }}, ${{ matrix.os }}, ${{ matrix.flavor }})
    runs-on: ${{ matrix.os }}
    env:
      TEST_PROJECT: ${{ matrix.flavor == 'plots' && 'test' || 'test/core' }}
      JULIA_PROJECT: ${{ matrix.flavor == 'plots' && 'test' || 'test/core' }}
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      JULIA_CPU_TARGET: generic
      JULIA_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        flavor: [core, plots]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
        if: matrix.os == 'ubuntu-latest'
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: tests-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.flavor }}
          include-matrix: false
          delete-old-caches: false
      - name: Install test dependencies
        shell: julia --startup-file=no --check-bounds=yes --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(ENV["TEST_PROJECT"])
          Pkg.develop(PackageSpec(; path = pwd()))
          Pkg.instantiate()
          using Preferences: set_preferences!
          set_preferences!(Base.UUID("37bc0722-8b3f-41d8-b4ae-17decd3486a9"),
              "precompile_workload" => false; force = true)
      - name: Precompile test dependencies
        shell: julia --startup-file=no --check-bounds=yes --color=yes {0}
        run: |
          using Pkg
          Pkg.precompile(; strict = true)
      - name: Save resolved test environment
        uses: actions/upload-artifact@v4
        with:
          name: test-environment-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.flavor }}
          path: |
            ${{ env.TEST_PROJECT }}/Manifest.toml
            ${{ env.TEST_PROJECT }}/LocalPreferences.toml
          if-no-files-found: error
          retention-days: 7
  test:
    name: test (${{ matrix.version }}, ${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    needs: [test-dependencies]
    env:
      GROUP: ${{ matrix.group }}
      TEST_PROJECT: ${{ startsWith(matrix.group, 'Plots') && 'test' || 'test/core' }}
      JULIA_PROJECT: ${{ startsWith(matrix.group, 'Plots') && 'test' || 'test/core' }}
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      JULIA_CPU_TARGET: generic
      JULIA_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.10 is both the minimum supported series and current LTS (2026-09-09).
        # macOS is handled by the separate, batched test-macos job below: GitHub's hosted
        # macOS runners have a much smaller concurrency limit than Linux/Windows, so the
        # full per-group matrix here would queue most macOS jobs for tens of minutes each
        # (observed up to ~50 min queue time for a single job) rather than running them.
        version: ["1.10", "1"]
        os: [ubuntu-latest, windows-latest]
        group: [Analytical, RadialFEM, MeridianFEM, Boundary, FullBEM, CylinderBEM, RegionBEM, NearPressure, RegionShapes, FishBEM, LowFrequencyRegions, GasResonance, CoupledResonance, Spheroidal, Oblique, Interfaces, Plots1D, Plots2D, Plots3DModels, Plots3DFull]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: tests-${{ matrix.os }}-${{ matrix.version }}-${{ startsWith(matrix.group, 'Plots') && 'plots' || 'core' }}
          include-matrix: false
          delete-old-caches: false
      - name: Restore resolved test environment
        uses: actions/download-artifact@v8
        with:
          name: test-environment-${{ matrix.os }}-${{ matrix.version }}-${{ startsWith(matrix.group, 'Plots') && 'plots' || 'core' }}
          path: ${{ env.TEST_PROJECT }}
      - name: Ensure cached dependencies are available
        shell: julia --startup-file=no --check-bounds=yes --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()
      # Coverage only needs to be collected once (line execution isn't OS-specific), and
      # --code-coverage=user disables inlining/optimizations in numerical hot loops, costing
      # 3-10x wall time — restricting it to one OS avoids paying that tax on all three.
      - name: Run test group
        if: matrix.version == '1.10' || matrix.os != 'ubuntu-latest'
        run: julia --startup-file=no --check-bounds=yes test/runtests.jl
      - name: Run test group with coverage
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        run: julia --startup-file=no --check-bounds=yes --code-coverage=user test/runtests.jl
      - name: Save coverage files
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.group }}
          path: |
            src/**/*.cov
            ext/**/*.cov
          if-no-files-found: warn
          retention-days: 14
  test-macos:
    # GitHub's hosted macOS runners have a much smaller concurrency limit than
    # Linux/Windows (Apple's licensing restricts macOS virtualization to Apple hardware),
    # so requesting one job per group here (as the `test` job does for ubuntu/windows)
    # queues most macOS jobs for tens of minutes waiting for a free runner. Batching
    # several groups into each job (via runtests.jl's comma-separated GROUP support)
    # keeps the same coverage with far fewer concurrent macOS job requests.
    name: test (${{ matrix.version }}, macos-latest, ${{ matrix.label }})
    runs-on: macos-latest
    needs: [test-dependencies]
    env:
      GROUP: ${{ matrix.groups }}
      TEST_PROJECT: ${{ matrix.flavor == 'plots' && 'test' || 'test/core' }}
      JULIA_PROJECT: ${{ matrix.flavor == 'plots' && 'test' || 'test/core' }}
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      JULIA_CPU_TARGET: generic
      JULIA_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.10"
            label: CoreBatch1
            flavor: core
            groups: "Analytical,RadialFEM,MeridianFEM,Boundary"
          - version: "1.10"
            label: CoreBatch2
            flavor: core
            groups: "FullBEM,CylinderBEM,RegionBEM,NearPressure"
          - version: "1.10"
            label: CoreBatch3
            flavor: core
            groups: "RegionShapes,FishBEM,LowFrequencyRegions,GasResonance"
          - version: "1.10"
            label: CoreBatch4
            flavor: core
            groups: "CoupledResonance,Spheroidal,Oblique,Interfaces"
          - version: "1.10"
            label: PlotsAll
            flavor: plots
            groups: "Plots1D,Plots2D,Plots3DModels,Plots3DFull"
          - version: "1"
            label: CoreBatch1
            flavor: core
            groups: "Analytical,RadialFEM,MeridianFEM,Boundary"
          - version: "1"
            label: CoreBatch2
            flavor: core
            groups: "FullBEM,CylinderBEM,RegionBEM,NearPressure"
          - version: "1"
            label: CoreBatch3
            flavor: core
            groups: "RegionShapes,FishBEM,LowFrequencyRegions,GasResonance"
          - version: "1"
            label: CoreBatch4
            flavor: core
            groups: "CoupledResonance,Spheroidal,Oblique,Interfaces"
          - version: "1"
            label: PlotsAll
            flavor: plots
            groups: "Plots1D,Plots2D,Plots3DModels,Plots3DFull"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: tests-macos-latest-${{ matrix.version }}-${{ matrix.flavor }}
          include-matrix: false
          delete-old-caches: false
      - name: Restore resolved test environment
        uses: actions/download-artifact@v8
        with:
          name: test-environment-macos-latest-${{ matrix.version }}-${{ matrix.flavor }}
          path: ${{ env.TEST_PROJECT }}
      - name: Ensure cached dependencies are available
        shell: julia --startup-file=no --check-bounds=yes --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()
      # No coverage here: it's collected on ubuntu only (see the `test` job).
      - name: Run test group
        run: julia --startup-file=no --check-bounds=yes test/runtests.jl
  install:
    name: Install (Julia ${{ matrix.version }}, ${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [standard, opt-out]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
        if: matrix.os == 'ubuntu-latest'
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      # No cache: each matrix job uses a fresh Julia depot and the checked-out source.
      - name: Verify isolated installation and precompile preferences
        env:
          JULIA_DEPOT_PATH: ${{ runner.temp }}/install-depot
        shell: julia --startup-file=no --color=yes {0}
        run: |
          empty!(ARGS)
          push!(ARGS, "${{ matrix.mode }}")
          include(joinpath(ENV["GITHUB_WORKSPACE"], "test", "precompile.jl"))
