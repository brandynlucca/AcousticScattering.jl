name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Install pinned formatter
        run: julia --project=dev -e 'using Pkg; Pkg.instantiate()'
      - name: Check SciML formatting
        run: julia --project=dev dev/format.jl --check
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.10 is both the minimum supported series and current LTS (2026-09-09).
        version: ["1.10", "1"]
        os: [ubuntu-latest]
        arch: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  install:
    name: Install (Julia ${{ matrix.version }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
        mode: [standard, opt-out]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      # No cache: the harness gives each case its own empty depot and source snapshot.
      - name: Verify isolated installation and precompile preferences
        run: julia --startup-file=no dev/check_install.jl --mode=${{ matrix.mode }}
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Build documentation and run examples
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
          julia --project=docs dev/check_deployment.jl
          julia --project=docs docs/make.jl
      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  docs-deploy:
    name: Deploy documentation
    needs: [format, test, install, docs]
    if: github.repository == 'brandynlucca/AcousticScattering.jl' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: documentation-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Install documentation tools
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: docs/build/
      - name: Publish validated documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/deploy.jl
      - name: Check out versioned documentation
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: documentation-site
      - name: Package GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation-site/
      - name: Deploy GitHub Pages site
        id: pages
        uses: actions/deploy-pages@v4
