name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Check SciML formatting
        shell: julia --startup-file=no --color=yes {0}
        run: |
          import Pkg
          Pkg.activate(; temp = true)
          Pkg.add(Pkg.PackageSpec(; name = "JuliaFormatter", version = "2.14.0"))
          using JuliaFormatter: format
          format(["src", "ext", "test", "docs"]; overwrite = false) ||
              error("Formatting required. See the developer guide for the formatting command.")
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.10 is both the minimum supported series and current LTS (2026-09-09).
        version: ["1.10", "1"]
        os: [ubuntu-latest]
        arch: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  install:
    name: Install (Julia ${{ matrix.version }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_LOAD_PATH: "@:@stdlib"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
        mode: [standard, opt-out]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      # No cache: each matrix job uses a fresh Julia depot and the checked-out source.
      - name: Verify isolated installation and precompile preferences
        env:
          JULIA_DEPOT_PATH: ${{ runner.temp }}/install-depot
        run: julia --startup-file=no test/precompile.jl ${{ matrix.mode }}
