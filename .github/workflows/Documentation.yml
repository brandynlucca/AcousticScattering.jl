name: Documentation
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Install documentation dependencies
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            using Preferences: set_preferences!
            set_preferences!(Base.UUID("37bc0722-8b3f-41d8-b4ae-17decd3486a9"),
              "precompile_workload" => false; force=true)'
      - name: Precompile documentation dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.precompile(; strict=true)'
      - name: Test documentation deployment guard
        run: julia --project=docs test/documentation.jl
      - name: Build documentation and run examples
        run: julia --project=docs docs/make.jl
      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  docs-deploy:
    name: Deploy documentation
    needs: [docs]
    if: github.repository == 'brandynlucca/AcousticScattering.jl' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: documentation-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v6
      - name: Install documentation tools
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          julia --project="${{ runner.temp }}/docs-deploy" -e '
            using Pkg, TOML
            version = TOML.parsefile("docs/Project.toml")["compat"]["Documenter"]
            Pkg.add(PackageSpec(; name="Documenter", version))'
      - name: Precompile deployment tools
        run: julia --project="${{ runner.temp }}/docs-deploy" -e 'using Pkg; Pkg.precompile(; strict=true)'
      - uses: actions/download-artifact@v8
        with:
          name: documentation
          path: docs/build/
      - name: Publish validated documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project="${{ runner.temp }}/docs-deploy" docs/deploy.jl
      - name: Check out versioned documentation
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: documentation-site
      - name: Package GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation-site/
      - name: Deploy GitHub Pages site
        id: pages
        uses: actions/deploy-pages@v4
