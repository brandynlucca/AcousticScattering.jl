name: TagBot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: JuliaRegistries/TagBot@cded32665b34ca0496d3ac10a67d08ddfc726963 # v1.25.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Optional write-enabled deploy key lets tags trigger documentation builds.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
