name: Install native build tools
description: Install tools required by the registered SpheroidalWaves dependency on Ubuntu
runs:
  using: composite
  steps:
    - name: Install CMake and GNU Fortran
      shell: bash
      run: |
        if ! command -v cmake >/dev/null || ! command -v gfortran >/dev/null || ! command -v make >/dev/null; then
          sudo apt-get update
          sudo apt-get install --yes cmake gfortran make
        fi
        cmake --version
        gfortran --version
